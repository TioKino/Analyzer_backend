name: Backend Tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest backend
    runs-on: ubuntu-latest
    # Un job sano tarda ~7 min. Sin tope, uno colgado se queda 6 h «in
    # progress» y el merge espera un check que no va a terminar.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 3.11 es lo que corre en producción (.python-version = 3.11.9). Antes
      # CI usaba 3.10, así que probábamos un intérprete distinto al desplegado.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Un mirror de apt colgado dejó este paso parado sin límite el
      # 2026-09-30 (run 36733398832), con el mismo commit en verde en el run
      # del pull_request. Cada intento lleva su tope y se reintenta; si los
      # tres fallan, el paso falla (no se sigue sin ffmpeg).
      - name: Install system deps (ffmpeg)
        timeout-minutes: 20
        run: |
          # libchromaprint-tools NO existe en el Debian de Render (verificado
          # 2026-07-07), por eso acoustic_fingerprint.py auto-descarga el fpcalc
          # estático de acoustid. En Ubuntu de Actions sí está, y tenerlo aquí
          # permite que los tests que tocan fpcalc corran de verdad.
          APT="-o Acquire::Retries=3 -o DPkg::Lock::Timeout=60"
          ok=0
          for i in 1 2 3; do
            if timeout 120 sudo apt-get $APT update \
               && timeout 240 sudo apt-get $APT install -y libchromaprint-tools ffmpeg; then
              ok=1; break
            fi
            echo "apt: el intento $i no terminó; reintento"
            # El mirror de Azure de la imagen puede quedarse sin contestar
            # horas (2026-11-11, Ubuntu 26.04: `Ign` en cada InRelease y los
            # tres intentos agotados). apt solo pasa al mirror siguiente de
            # la lista tras sus propios plazos, más largos que los de aquí:
            # los reintentos van directos a archive.ubuntu.com.
            if [ -f /etc/apt/apt-mirrors.txt ] \
               && grep -q 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
              echo "apt: sin el mirror de Azure:"; cat /etc/apt/apt-mirrors.txt
            fi
            sleep 10
          done
          [ "$ok" = 1 ]

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt, NO requirements-minimal.txt: es lo que se instala
          # en Render. Con el mínimo, soundfile y pyacoustid (dependencias
          # reales de producción) nunca llegaban a importarse en CI.
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # Sin `-x`: cortar en el primer fallo oculta el resto y obliga a iterar
      # de uno en uno. Mejor ver el panorama completo en una sola pasada.
      - name: Run pytest
        run: pytest -q --tb=short

      # OBLIGATORIO desde el 2026-11-13 (auditoría S5). Mientras fue
      # informativo nadie lo miró: el 12-nov daba 47 avisos en fastapi,
      # starlette, python-multipart, requests y cryptography. Mira solo
      # requirements.txt (lo que corre en Render), no lo de los tests.
      # Si una CVE recién publicada lo pone rojo, se sube esa dependencia en
      # un PR aparte; no se apaga el paso.
      - name: Auditoría de dependencias
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off -r requirements.txt
